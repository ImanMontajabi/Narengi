name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS, arm64)
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # xcodebuild forwards TEST_RUNNER_* variables to the test process (as NARENGI_CI); a few Vision-based tests
      # skip themselves on virtualised runners.
      TEST_RUNNER_NARENGI_CI: "1"
    steps:
      - uses: actions/checkout@v4

      # The runner defaults to an older Xcode than the one that generates the project, so use the newest installed.
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ffmpeg

      # The bundled helpers are not in the repository. cwebp and ExifTool are downloaded and checksum-verified;
      # ffmpeg is copied from Homebrew and relinked, exactly as for a release.
      - name: Fetch and bundle helper tools
        run: |
          scripts/setup-vendor.sh
          scripts/bundle-ffmpeg.sh

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project Narengi.xcodeproj -scheme Narengi -configuration Debug \
            -derivedDataPath build -destination 'platform=macOS,arch=arm64' test 2>&1 | tee xcodebuild.log | tail -n 40

      - name: Show what failed
        if: failure()
        run: grep -E "error:|Test Case .* failed|\*\* (BUILD|TEST) FAILED" xcodebuild.log | head -60
